name: RDP-Optimized-Working

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Validate ngrok Secret
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
              Write-Host "ERROR: NGROK_AUTH_TOKEN secret is missing." -ForegroundColor Red
              Write-Host "Add it in Repository Settings -> Secrets and variables -> Actions." -ForegroundColor Yellow
              exit 1
          }

          Write-Host "NGROK_AUTH_TOKEN is present." -ForegroundColor Green

      - name: Enable Stable Performance Mode
        shell: powershell
        run: |
          Write-Host "Applying stable performance settings..." -ForegroundColor Cyan

          # Try to enable Ultimate Performance.
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null

          $ultimate = powercfg /list | Select-String "Ultimate Performance" | Select-Object -First 1

          if ($ultimate) {
              $guid = [regex]::Match($ultimate.ToString(), '[0-9a-fA-F-]{36}').Value

              if ($guid) {
                  powercfg /setactive $guid
                  Write-Host "Ultimate Performance enabled." -ForegroundColor Green
              }
          }
          else {
              powercfg /setactive SCHEME_MIN
              Write-Host "High Performance enabled." -ForegroundColor Green
          }

          # Prevent sleep during the session.
          powercfg /change monitor-timeout-ac 0 2>$null
          powercfg /change standby-timeout-ac 0 2>$null
          powercfg /change disk-timeout-ac 0 2>$null
          powercfg /hibernate off 2>$null

          # Reduce unnecessary visual effects.
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Force | Out-Null
          Set-ItemProperty `
              -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
              -Name "VisualFXSetting" `
              -Type DWord `
              -Value 2 `
              -Force

          Set-ItemProperty `
              -Path "HKCU:\Control Panel\Desktop" `
              -Name "MenuShowDelay" `
              -Value "0" `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "Performance profile applied." -ForegroundColor Green

      - name: Reduce Safe Background Activity
        shell: powershell
        run: |
          Write-Host "Stopping a few nonessential services..." -ForegroundColor Cyan

          $services = @(
              "DiagTrack",
              "dmwappushservice",
              "WSearch",
              "MapsBroker",
              "Fax"
          )

          foreach ($serviceName in $services) {
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

              if ($svc -and $svc.Status -eq "Running") {
                  Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Background activity reduced." -ForegroundColor Green

      - name: Create RDP User and Password
        shell: powershell
        run: |
          Write-Host "Creating temporary RDP account..." -ForegroundColor Cyan

          $username = "rdpadmin"

          # Generate a strong random password automatically.
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%*_-"
          $password = -join (1..20 | ForEach-Object {
              $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
          })

          # Ensure complexity.
          $password = "Aa9!" + $password

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $securePassword
          }
          else {
              New-LocalUser `
                  -Name $username `
                  -Password $securePassword `
                  -FullName "RDP Administrator" `
                  -Description "Temporary GitHub Actions RDP User"
          }

          Enable-LocalUser -Name $username -ErrorAction SilentlyContinue
          Set-LocalUser -Name $username -PasswordNeverExpires $true -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $username `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction SilentlyContinue

          # Store password for later workflow steps.
          "RDP_USERNAME=.\$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "RDP user created successfully." -ForegroundColor Green

      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..." -ForegroundColor Cyan

          $terminalServer = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcp = "$terminalServer\WinStations\RDP-Tcp"

          # Enable Remote Desktop.
          Set-ItemProperty `
              -Path $terminalServer `
              -Name "fDenyTSConnections" `
              -Type DWord `
              -Value 0 `
              -Force

          # Use the standard RDP port.
          Set-ItemProperty `
              -Path $rdpTcp `
              -Name "PortNumber" `
              -Type DWord `
              -Value 3389 `
              -Force

          # Enable NLA for modern Windows App / mstsc compatibility.
          Set-ItemProperty `
              -Path $rdpTcp `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1 `
              -Force

          Set-ItemProperty `
              -Path $rdpTcp `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 1 `
              -Force `
              -ErrorAction SilentlyContinue

          # Force TCP transport because this ngrok tunnel is TCP.
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null

          Set-ItemProperty `
              -Path $policyPath `
              -Name "SelectTransport" `
              -Type DWord `
              -Value 1 `
              -Force

          # Enable compression.
          Set-ItemProperty `
              -Path $rdpTcp `
              -Name "fInheritCompressionType" `
              -Type DWord `
              -Value 0 `
              -Force `
              -ErrorAction SilentlyContinue

          Set-ItemProperty `
              -Path $rdpTcp `
              -Name "CompressionType" `
              -Type DWord `
              -Value 1 `
              -Force `
              -ErrorAction SilentlyContinue

          # Ensure RDP service is running.
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          # Enable firewall access for TCP 3389.
          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -DisplayName "RDP TCP 3389" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule `
                  -DisplayName "RDP TCP 3389" `
                  -Direction Inbound `
                  -Action Allow `
                  -Protocol TCP `
                  -LocalPort 3389 | Out-Null
          }

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

          # Verify local listener.
          $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Host "ERROR: RDP is not listening on TCP 3389." -ForegroundColor Red
              Get-Service TermService
              netstat -ano | Select-String ":3389"
              exit 1
          }

          $localTest = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $localTest.TcpTestSucceeded) {
              Write-Host "ERROR: Local TCP 3389 test failed." -ForegroundColor Red
              exit 1
          }

          Write-Host "RDP is listening and reachable on TCP 3389." -ForegroundColor Green

      - name: Install ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Write-Host "Installing ngrok..." -ForegroundColor Cyan

          $ngrokDir = "C:\ngrok"
          $ngrokExe = "$ngrokDir\ngrok.exe"
          $ngrokZip = "$env:TEMP\ngrok.zip"

          Remove-Item $ngrokDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $ngrokZip -Force -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Path $ngrokDir `
              -Force | Out-Null

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $urls = @(
              "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip",
              "https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          )

          $downloaded = $false

          foreach ($url in $urls) {
              try {
                  Write-Host "Downloading from $url" -ForegroundColor Yellow

                  Invoke-WebRequest `
                      -Uri $url `
                      -OutFile $ngrokZip `
                      -UseBasicParsing `
                      -TimeoutSec 90

                  if (
                      (Test-Path $ngrokZip) -and
                      ((Get-Item $ngrokZip).Length -gt 5000000)
                  ) {
                      $downloaded = $true
                      break
                  }
              }
              catch {
                  Write-Host "Download failed: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }

          if (-not $downloaded) {
              Write-Host "ERROR: Could not download ngrok." -ForegroundColor Red
              exit 1
          }

          Expand-Archive `
              -Path $ngrokZip `
              -DestinationPath $ngrokDir `
              -Force

          Remove-Item $ngrokZip -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path $ngrokExe)) {
              Write-Host "ERROR: ngrok.exe was not found." -ForegroundColor Red
              exit 1
          }

          Write-Host "ngrok version:" -ForegroundColor Cyan
          & $ngrokExe version

          & $ngrokExe config add-authtoken $env:NGROK_AUTH_TOKEN

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: ngrok authentication failed." -ForegroundColor Red
              exit 1
          }

          Write-Host "ngrok installed and authenticated." -ForegroundColor Green

      - name: Start ngrok TCP Tunnel
        shell: powershell
        run: |
          Write-Host "Starting ngrok TCP tunnel..." -ForegroundColor Cyan

          $ngrokExe = "C:\ngrok\ngrok.exe"

          Get-Process ngrok -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process `
              -FilePath $ngrokExe `
              -ArgumentList "tcp","3389","--log=stdout","--log-format=json" `
              -WindowStyle Hidden `
              -RedirectStandardOutput "C:\ngrok\ngrok.log" `
              -RedirectStandardError "C:\ngrok\ngrok-error.log"

          $publicUrl = $null

          for ($i = 1; $i -le 45; $i++) {
              Start-Sleep -Seconds 2

              try {
                  $tunnels = Invoke-RestMethod `
                      -Uri "http://127.0.0.1:4040/api/tunnels" `
                      -TimeoutSec 4

                  $tcpTunnel = $tunnels.tunnels |
                      Where-Object { $_.proto -eq "tcp" } |
                      Select-Object -First 1

                  if ($tcpTunnel.public_url) {
                      $publicUrl = $tcpTunnel.public_url
                      break
                  }
              }
              catch {
                  Write-Host "Waiting for ngrok... $i/45" -ForegroundColor DarkGray
              }
          }

          if (-not $publicUrl) {
              Write-Host "ERROR: ngrok tunnel did not become ready." -ForegroundColor Red

              Write-Host "--- ngrok stdout ---" -ForegroundColor Yellow
              Get-Content "C:\ngrok\ngrok.log" -ErrorAction SilentlyContinue

              Write-Host "--- ngrok stderr ---" -ForegroundColor Yellow
              Get-Content "C:\ngrok\ngrok-error.log" -ErrorAction SilentlyContinue

              exit 1
          }

          $clean = $publicUrl -replace "^tcp://", ""

          "NGROK_URL=$clean" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ngrok tunnel ready: $clean" -ForegroundColor Green

      - name: Verify ngrok Tunnel Registration
        shell: powershell
        run: |
          Write-Host "Verifying ngrok tunnel registration..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:NGROK_URL)) {
              Write-Host "ERROR: NGROK_URL is empty." -ForegroundColor Red
              exit 1
          }

          # Do NOT test the public ngrok endpoint from the same GitHub runner.
          # A same-host/hairpin TCP test can fail even when the tunnel is valid
          # and reachable from your own computer.
          try {
              $tunnels = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:4040/api/tunnels" `
                  -TimeoutSec 5

              $tcpTunnel = $tunnels.tunnels |
                  Where-Object {
                      $_.proto -eq "tcp" -and
                      $_.public_url
                  } |
                  Select-Object -First 1

              if (-not $tcpTunnel) {
                  Write-Host "ERROR: ngrok API does not report an active TCP tunnel." -ForegroundColor Red
                  exit 1
              }

              $reportedAddress = $tcpTunnel.public_url -replace "^tcp://", ""

              Write-Host "ngrok API reports active TCP tunnel." -ForegroundColor Green
              Write-Host "Public address: $reportedAddress" -ForegroundColor Cyan

              if ($reportedAddress -ne $env:NGROK_URL) {
                  Write-Host "Updating NGROK_URL to current tunnel address." -ForegroundColor Yellow
                  "NGROK_URL=$reportedAddress" |
                      Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
          }
          catch {
              Write-Host "ERROR: Could not query local ngrok API." -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
              exit 1
          }

          # Final local RDP check. This is the meaningful server-side test.
          $localTest = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $localTest.TcpTestSucceeded) {
              Write-Host "ERROR: RDP is no longer reachable locally on TCP 3389." -ForegroundColor Red
              exit 1
          }

          Write-Host "RDP + ngrok tunnel are ready." -ForegroundColor Green

      - name: Show RDP Login Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "                 RDP CONNECTION READY" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "PC / Host : $env:NGROK_URL" -ForegroundColor Cyan
          Write-Host "Username  : $env:RDP_USERNAME" -ForegroundColor Cyan
          Write-Host "Password  : $env:RDP_PASSWORD" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Open Windows App or mstsc and enter the values above." -ForegroundColor Yellow
          Write-Host "If prompted about a certificate, accept it for this temporary runner." -ForegroundColor Yellow
          Write-Host ""

      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          $endTime = (Get-Date).AddMinutes(345)
          $ngrokExe = "C:\ngrok\ngrok.exe"
          $currentUrl = $env:NGROK_URL

          Write-Host "Keeping the runner alive..." -ForegroundColor Cyan

          while ((Get-Date) -lt $endTime) {
              # Keep RDP service alive.
              $rdpService = Get-Service `
                  -Name TermService `
                  -ErrorAction SilentlyContinue

              if (-not $rdpService -or $rdpService.Status -ne "Running") {
                  Write-Host "TermService stopped. Restarting..." -ForegroundColor Yellow
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 4
              }

              # Ensure RDP is still listening.
              $listener = Get-NetTCPConnection `
                  -State Listen `
                  -LocalPort 3389 `
                  -ErrorAction SilentlyContinue

              if (-not $listener) {
                  Write-Host "RDP listener disappeared. Restarting TermService..." -ForegroundColor Yellow
                  Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
              }

              # Keep ngrok alive.
              $ngrokProcess = Get-Process `
                  -Name ngrok `
                  -ErrorAction SilentlyContinue

              if (-not $ngrokProcess) {
                  Write-Host "ngrok stopped. Restarting..." -ForegroundColor Yellow

                  Start-Process `
                      -FilePath $ngrokExe `
                      -ArgumentList "tcp","3389","--log=stdout","--log-format=json" `
                      -WindowStyle Hidden `
                      -RedirectStandardOutput "C:\ngrok\ngrok.log" `
                      -RedirectStandardError "C:\ngrok\ngrok-error.log"

                  Start-Sleep -Seconds 10
              }

              # Refresh tunnel address in case ngrok restarted.
              try {
                  $tunnels = Invoke-RestMethod `
                      -Uri "http://127.0.0.1:4040/api/tunnels" `
                      -TimeoutSec 4

                  $tcpTunnel = $tunnels.tunnels |
                      Where-Object { $_.proto -eq "tcp" } |
                      Select-Object -First 1

                  if ($tcpTunnel.public_url) {
                      $newUrl = $tcpTunnel.public_url -replace "^tcp://", ""

                      if ($newUrl -ne $currentUrl) {
                          $currentUrl = $newUrl

                          Write-Host ""
                          Write-Host "=============================================" -ForegroundColor Yellow
                          Write-Host "NGROK ADDRESS CHANGED" -ForegroundColor Yellow
                          Write-Host "New PC / Host: $currentUrl" -ForegroundColor Cyan
                          Write-Host "Username     : $env:RDP_USERNAME" -ForegroundColor Cyan
                          Write-Host "Password     : $env:RDP_PASSWORD" -ForegroundColor Cyan
                          Write-Host "=============================================" -ForegroundColor Yellow
                          Write-Host ""
                      }
                  }
              }
              catch {}

              # Lightweight system health info.
              try {
                  $cpu = (
                      Get-CimInstance Win32_Processor |
                      Measure-Object -Property LoadPercentage -Average
                  ).Average

                  $os = Get-CimInstance Win32_OperatingSystem

                  $memoryPercent = [math]::Round(
                      (($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) /
                      $os.TotalVisibleMemorySize) * 100,
                      1
                  )

                  Write-Host (
                      "[{0}] CPU: {1}% | RAM: {2}% | RDP: OK | ngrok: OK" -f `
                      (Get-Date -Format "HH:mm:ss"),
                      [math]::Round($cpu, 1),
                      $memoryPercent
                  ) -ForegroundColor Green
              }
              catch {
                  Write-Host "Session alive." -ForegroundColor Green
              }

              Start-Sleep -Seconds 120
          }

          Write-Host "Maximum session duration reached." -ForegroundColor Yellow
