name: RDP-Optimized-Stable

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Validate Required Secrets
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
              Write-Host "Missing NGROK_AUTH_TOKEN secret." -ForegroundColor Red
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Host "Missing RDP_PASSWORD secret." -ForegroundColor Red
              exit 1
          }

          Write-Host "Required secrets are present." -ForegroundColor Green

      - name: Stable Performance Profile
        shell: powershell
        run: |
          Write-Host "Applying stable performance settings..." -ForegroundColor Cyan

          # High/Ultimate performance if available. This changes scheduling/power policy,
          # but does not pretend to add CPU cores or RAM to the hosted runner.
          $ultimateGuid = "e9a42b02-d5df-448d-aa00-03f14749eb61"
          powercfg -duplicatescheme $ultimateGuid 2>$null | Out-Null

          $ultimate = powercfg /list | Select-String "Ultimate Performance" | Select-Object -First 1
          if ($ultimate) {
              $guid = [regex]::Match($ultimate.ToString(), '[0-9a-fA-F-]{36}').Value
              if ($guid) {
                  powercfg /setactive $guid
                  Write-Host "Ultimate Performance power plan enabled." -ForegroundColor Green
              }
          } else {
              powercfg /setactive SCHEME_MIN
              Write-Host "High Performance power plan enabled." -ForegroundColor Green
          }

          powercfg /change monitor-timeout-ac 0 2>$null
          powercfg /change standby-timeout-ac 0 2>$null
          powercfg /change disk-timeout-ac 0 2>$null
          powercfg /hibernate off 2>$null

          # Reduce UI effects that consume CPU/GPU bandwidth in a remote session.
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
              -Name "VisualFXSetting" -Type DWord -Value 2 -Force

          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" `
              -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue

          # Do NOT disable the page file, SysMain, NIC offloads, DNS, ECN, RSS/RSC,
          # or change congestion-control algorithms. On a virtual hosted runner those
          # changes can make latency less predictable instead of improving it.
          Write-Host "Stable performance profile applied." -ForegroundColor Green

      - name: Trim Nonessential Background Services
        shell: powershell
        run: |
          Write-Host "Reducing safe nonessential background activity..." -ForegroundColor Cyan

          # Keep networking, Windows Update infrastructure, SysMain, WMI, event log,
          # Remote Desktop services, and core system services untouched.
          $servicesToStop = @(
              "DiagTrack",
              "dmwappushservice",
              "WSearch",
              "MapsBroker",
              "Fax"
          )

          foreach ($serviceName in $servicesToStop) {
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq "Running") {
                  Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Background-service trim complete." -ForegroundColor Green

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "rdpadmin"
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
              Set-LocalUser -Name $username -Password $securePassword
          } else {
              New-LocalUser `
                  -Name $username `
                  -Password $securePassword `
                  -FullName "RDP Administrator" `
                  -Description "Temporary RDP access account"
          }

          Enable-LocalUser -Name $username -ErrorAction SilentlyContinue
          Set-LocalUser -Name $username -PasswordNeverExpires $true -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          Write-Host "RDP account ready: .\rdpadmin" -ForegroundColor Green

      - name: Configure RDP for Stability
        shell: powershell
        run: |
          Write-Host "Configuring RDP..." -ForegroundColor Cyan

          $ts = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcp = "$ts\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $ts -Name "fDenyTSConnections" -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name "PortNumber" -Type DWord -Value 3389 -Force

          # NLA + negotiated security improves compatibility with current RDP clients.
          Set-ItemProperty -Path $rdpTcp -Name "UserAuthentication" -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name "SecurityLayer" -Type DWord -Value 1 -Force -ErrorAction SilentlyContinue

          # ngrok TCP forwards TCP only. Force RDP to use TCP so the client does not
          # waste time attempting a UDP transport that cannot traverse this tunnel.
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null
          Set-ItemProperty -Path $policyPath -Name "SelectTransport" -Type DWord -Value 1 -Force

          # Keep compression enabled; avoid exotic/unverified RDP registry tuning.
          Set-ItemProperty -Path $rdpTcp -Name "fInheritCompressionType" -Type DWord -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpTcp -Name "CompressionType" -Type DWord -Value 1 -Force -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          if (-not (Get-NetFirewallRule -DisplayName "RDP TCP 3389" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule `
                  -DisplayName "RDP TCP 3389" `
                  -Direction Inbound `
                  -Action Allow `
                  -Protocol TCP `
                  -LocalPort 3389 | Out-Null
          }

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 4

          $listener = Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue
          if (-not $listener) {
              Write-Host "RDP listener is not active on TCP 3389." -ForegroundColor Red
              Get-Service TermService | Format-List *
              netstat -ano | Select-String ":3389"
              exit 1
          }

          $test = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if (-not $test.TcpTestSucceeded) {
              Write-Host "Local RDP connectivity test failed." -ForegroundColor Red
              exit 1
          }

          Write-Host "RDP is healthy on TCP 3389." -ForegroundColor Green

      - name: Install and Start ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Write-Host "Installing ngrok..." -ForegroundColor Cyan

          $ngrokDir = "C:\ngrok"
          $ngrokExe = "$ngrokDir\ngrok.exe"
          $ngrokZip = "$env:TEMP\ngrok.zip"

          Remove-Item $ngrokDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $ngrokDir -Force | Out-Null

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $urls = @(
              "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip",
              "https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          )

          $downloaded = $false
          foreach ($url in $urls) {
              try {
                  Invoke-WebRequest -Uri $url -OutFile $ngrokZip -UseBasicParsing -TimeoutSec 90
                  if ((Test-Path $ngrokZip) -and (Get-Item $ngrokZip).Length -gt 5000000) {
                      $downloaded = $true
                      break
                  }
              } catch {
                  Write-Host "Download attempt failed: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }

          if (-not $downloaded) {
              Write-Host "Could not download ngrok." -ForegroundColor Red
              exit 1
          }

          Expand-Archive -Path $ngrokZip -DestinationPath $ngrokDir -Force
          Remove-Item $ngrokZip -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path $ngrokExe)) {
              Write-Host "ngrok.exe was not found after extraction." -ForegroundColor Red
              exit 1
          }

          & $ngrokExe config add-authtoken $env:NGROK_AUTH_TOKEN
          if ($LASTEXITCODE -ne 0) {
              Write-Host "ngrok authentication failed." -ForegroundColor Red
              exit 1
          }

          Start-Process `
              -FilePath $ngrokExe `
              -ArgumentList "tcp","3389","--log=stdout","--log-format=json" `
              -WindowStyle Hidden `
              -RedirectStandardOutput "$ngrokDir\ngrok.log" `
              -RedirectStandardError "$ngrokDir\ngrok-error.log"

          $publicUrl = $null
          for ($i = 1; $i -le 40; $i++) {
              Start-Sleep -Seconds 2

              try {
                  $tunnels = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 4
                  $tcp = $tunnels.tunnels |
                      Where-Object { $_.proto -eq "tcp" } |
                      Select-Object -First 1

                  if ($tcp.public_url) {
                      $publicUrl = $tcp.public_url
                      break
                  }
              } catch {}
          }

          if (-not $publicUrl) {
              Write-Host "ngrok tunnel did not become ready." -ForegroundColor Red
              Get-Content "$ngrokDir\ngrok-error.log" -ErrorAction SilentlyContinue
              exit 1
          }

          $clean = $publicUrl -replace "^tcp://", ""
          "NGROK_URL=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ngrok tunnel ready: $clean" -ForegroundColor Green

      - name: Verify End-to-End Tunnel
        shell: powershell
        run: |
          $parts = $env:NGROK_URL -split ":"
          if ($parts.Count -lt 2) {
              Write-Host "Invalid NGROK_URL: $env:NGROK_URL" -ForegroundColor Red
              exit 1
          }

          $hostName = ($parts[0..($parts.Count - 2)] -join ":")
          $port = [int]$parts[-1]

          Write-Host "Testing public tunnel endpoint..." -ForegroundColor Cyan
          $publicTest = Test-NetConnection -ComputerName $hostName -Port $port -WarningAction SilentlyContinue

          if (-not $publicTest.TcpTestSucceeded) {
              Write-Host "Public ngrok TCP endpoint is not reachable yet." -ForegroundColor Red
              exit 1
          }

          Write-Host "Public tunnel endpoint is reachable." -ForegroundColor Green

      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "RDP CONNECTION READY" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "PC address : $env:NGROK_URL" -ForegroundColor Cyan
          Write-Host "Username   : .\rdpadmin" -ForegroundColor Cyan
          Write-Host "Password   : value of your RDP_PASSWORD secret" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green

      - name: Keep Session Healthy
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $endTime = (Get-Date).AddMinutes(350)
          $ngrokExe = "C:\ngrok\ngrok.exe"
          $lastPublicUrl = $env:NGROK_URL

          while ((Get-Date) -lt $endTime) {
              # RDP service health
              $rdp = Get-Service TermService -ErrorAction SilentlyContinue
              if (-not $rdp -or $rdp.Status -ne "Running") {
                  Write-Host "RDP service stopped; restarting..." -ForegroundColor Yellow
                  Start-Service TermService -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 3
              }

              # Local listener health
              $listener = Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue
              if (-not $listener) {
                  Write-Host "RDP listener missing; restarting TermService..." -ForegroundColor Yellow
                  Restart-Service TermService -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 4
              }

              # ngrok process health
              $ngrok = Get-Process ngrok -ErrorAction SilentlyContinue
              if (-not $ngrok) {
                  Write-Host "ngrok stopped; restarting tunnel..." -ForegroundColor Yellow

                  Start-Process `
                      -FilePath $ngrokExe `
                      -ArgumentList "tcp","3389","--log=stdout","--log-format=json" `
                      -WindowStyle Hidden `
                      -RedirectStandardOutput "C:\ngrok\ngrok.log" `
                      -RedirectStandardError "C:\ngrok\ngrok-error.log"

                  Start-Sleep -Seconds 8
              }

              # Refresh public address after a tunnel restart.
              try {
                  $tunnels = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 4
                  $tcp = $tunnels.tunnels |
                      Where-Object { $_.proto -eq "tcp" } |
                      Select-Object -First 1

                  if ($tcp.public_url) {
                      $currentUrl = $tcp.public_url -replace "^tcp://", ""
                      if ($currentUrl -ne $lastPublicUrl) {
                          $lastPublicUrl = $currentUrl
                          Write-Host "IMPORTANT: ngrok address changed to: $currentUrl" -ForegroundColor Yellow
                      }
                  }
              } catch {}

              # Lightweight telemetry only; no aggressive auto-tuning.
              $cpu = (Get-CimInstance Win32_Processor |
                  Measure-Object -Property LoadPercentage -Average).Average

              $os = Get-CimInstance Win32_OperatingSystem
              $memoryPct = [math]::Round(
                  (($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) /
                  $os.TotalVisibleMemorySize) * 100, 1
              )

              Write-Host ("[{0}] CPU {1}% | Memory {2}% | RDP OK | ngrok OK" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  [math]::Round($cpu, 1),
                  $memoryPct
              ) -ForegroundColor Green

              Start-Sleep -Seconds 120
          }
